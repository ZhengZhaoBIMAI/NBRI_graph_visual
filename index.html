<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBRI Research Ecosystem</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="graph-shell">
      <header class="masthead">
        <p>National Building Research Institute</p>
        <h1>Research Ecosystem</h1>
      </header>

      <section class="graph-stage" aria-label="NBRI organization graph">
        <svg id="graph" role="img" aria-labelledby="graph-title graph-desc">
          <title id="graph-title">NBRI research center organization graph</title>
          <desc id="graph-desc">
            Force-directed overview of NBRI researchers, collaborators, labs,
            lab members, and partner institutions.
          </desc>
        </svg>

        <aside class="legend" aria-label="Relationship legend">
          <h2>Relations</h2>
          <div>
            <span class="legend-line affiliate"></span>
            <span>Affiliated with</span>
          </div>
          <div>
            <span class="legend-line cooperate"></span>
            <span>Cooperated with</span>
          </div>
        </aside>

        <aside class="node-info" aria-live="polite" aria-label="Selected node information">

          <h2 id="info-name">National Building Research Institute</h2>
          <dl id="info-fields"></dl>
        </aside>
      </section>
    </main>

    <script src="./graph-data.js"></script>
    <script src="./graph.js"></script>
  </body>
</html>
